[build-system]
requires = ["hatchling==1.29.*", "hatch-requirements-txt==0.4.1"]
build-backend = "hatchling.build"

[project]
name = "deployer-dev"
description = "Deploy JupyterHubs for the 2i2c Infrastructure"
version = "0.0.1"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.13"
dependencies = [

]

[project.entry-points."deployer.apps"]
deployer-dev = "deployer_dev.commands"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "./tests",
]

[tool.codespell]
skip = '.git,*.pdf,*.svg,*.secret.*,*.key'
ignore-words-list = 'aks'

[tool.black]
force-exclude = '''
src/deployer_dev/commands/generate/cryptnono_config/enc-blocklist-generator.secret.py
'''
