[build-system]
requires = ["hatchling==1.29.*", "hatch-requirements-txt==0.4.1"]
build-backend = "hatchling.build"

[project]
name = "2i2c-deployer"
description = "Deploy JupyterHubs for the 2i2c Infrastructure"
version = "0.0.1"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.13"
dependencies = [
  # ruamel.yaml is used to read and write .yaml files.
  "ruamel.yaml==0.19.*",
  # jsonschema is used for validating cluster.yaml configurations
  "jsonschema==4.*",
  # rich, py-markdown-table, tabulate are used for pretty printing outputs that would otherwise
  # be difficult to parse by a human
  "rich==15.*",
  "typer==0.26.*",
  "py-markdown-table==1.3.*"
]

[project.scripts]
deployer = "deployer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["deployer"]


[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "./tests",
]

[tool.codespell]
skip = '.git,*.pdf,*.svg,*.secret.*,*.key'
ignore-words-list = 'aks'


